<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Christmas | Creative Tech Demo</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Times+New+Roman&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #d4af37;
            --cream: #fceea7;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(212, 175, 55, 0.3);
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000; 
            font-family: 'Times New Roman', serif;
            user-select: none;
        }

        /* Loader */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 2px solid rgba(212, 175, 55, 0.1);
            border-top: 2px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        .loader-text {
            color: var(--gold);
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
            font-size: 14px;
        }

        /* UI Overlay */
        #ui-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        
        h1 {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 56px;
            margin: 0;
            background: linear-gradient(to bottom, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
            pointer-events: auto;
        }

        .controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .upload-wrapper input[type="file"] {
            display: none;
        }

        .btn {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px 30px;
            font-family: 'Cinzel', serif;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        }

        .btn:hover {
            background: rgba(212, 175, 55, 0.1);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
        }

        .hint {
            color: rgba(255, 255, 255, 0.4);
            font-size: 10px;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .status-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            color: var(--gold);
            padding: 5px 15px;
            font-size: 12px;
            font-family: 'Cinzel', serif;
            border-radius: 20px;
        }

        .ui-hidden {
            opacity: 0;
            pointer-events: none !important;
        }

        /* Hidden CV Elements */
        #webcam-container {
            position: absolute;
            bottom: 10px;
            right: 10px;
            opacity: 0; /* Hidden but active */
            pointer-events: none;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
        }
    }
    </script>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">LOADING HOLIDAY MAGIC</div>
    </div>

    <div id="ui-container">
        <h1>Merry Christmas</h1>
        <div class="status-badge" id="status-text">INITIALIZING AI...</div>
        
        <div class="controls">
            <div class="upload-wrapper">
                <label class="btn">
                    ADD MEMORIES
                    <input type="file" id="file-input" accept="image/*">
                </label>
            </div>
            <div class="hint">PRESS 'H' TO HIDE CONTROLS</div>
        </div>
    </div>

    <div id="webcam-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="cv-canvas"></canvas>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

        // --- CONSTANTS & STATE ---
        const CONFIG = {
            colors: { gold: 0xd4af37, cream: 0xfceea7, red: 0xaa0000, green: 0x003300 },
            count: { main: 1500, dust: 2500 },
            modes: { TREE: 'TREE', SCATTER: 'SCATTER', FOCUS: 'FOCUS' }
        };

        const STATE = {
            mode: CONFIG.modes.TREE,
            targetPhotoIndex: -1,
            hand: { x: 0.5, y: 0.5, present: false },
            isLoaded: false
        };

        // --- ASSET GENERATION ---
        class AssetFactory {
            static createCandyCaneTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 64; canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 64, 64);
                ctx.fillStyle = '#cc0000';
                ctx.beginPath();
                for(let i=-64; i<128; i+=16) {
                    ctx.moveTo(i, 0); ctx.lineTo(i+8, 0); ctx.lineTo(i-56, 64); ctx.lineTo(i-64, 64);
                }
                ctx.fill();
                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
                return tex;
            }

            static createDefaultPhoto() {
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                
                // Background
                const grad = ctx.createLinearGradient(0,0,512,512);
                grad.addColorStop(0, '#001100'); grad.addColorStop(1, '#003300');
                ctx.fillStyle = grad; ctx.fillRect(0,0,512,512);
                
                // Border
                ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 20;
                ctx.strokeRect(10,10,492,492);
                
                // Text
                ctx.font = 'bold 60px Times New Roman';
                ctx.fillStyle = '#fceea7';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('JOYEUX', 256, 200);
                ctx.fillText('NOEL', 256, 280);
                
                // Sparkles
                ctx.fillStyle = '#fff';
                for(let i=0; i<30; i++) {
                    ctx.beginPath();
                    ctx.arc(Math.random()*512, Math.random()*512, Math.random()*3, 0, Math.PI*2);
                    ctx.fill();
                }

                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                return tex;
            }
        }

        // --- PARTICLE SYSTEM ---
        class Particle {
            constructor(mesh, type = 'ORNAMENT') {
                this.mesh = mesh;
                this.type = type; // 'ORNAMENT' or 'PHOTO'
                this.basePos = new THREE.Vector3();
                this.targetPos = new THREE.Vector3();
                this.velocity = new THREE.Vector3();
                this.rotationAxis = new THREE.Vector3(Math.random(), Math.random(), Math.random()).normalize();
                this.rotationSpeed = Math.random() * 0.02 + 0.01;
                
                // Unique randoms for tree formation
                this.treeParam = Math.random(); 
                this.scatterDir = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize();
                this.scatterRadius = 10 + Math.random() * 15;
            }

            update(dt, time) {
                // Logic based on global STATE.mode
                if (STATE.mode === CONFIG.modes.TREE) {
                    // Spiral Cone: y from -10 to 10
                    // radius shrinks as y goes up
                    const h = (this.treeParam * 25) - 10; // Height -10 to 15
                    const angle = this.treeParam * 25 * Math.PI; // many turns
                    const maxR = 12 * (1 - this.treeParam); // Taper
                    
                    this.targetPos.set(
                        Math.cos(angle + time * 0.1) * maxR,
                        h,
                        Math.sin(angle + time * 0.1) * maxR
                    );
                    
                    // Gentle rotation align
                    this.mesh.rotation.x = THREE.MathUtils.lerp(this.mesh.rotation.x, 0, dt);
                    this.mesh.rotation.z = THREE.MathUtils.lerp(this.mesh.rotation.z, 0, dt);
                    
                } else if (STATE.mode === CONFIG.modes.SCATTER) {
                    // Exploded Sphere
                    this.targetPos.copy(this.scatterDir).multiplyScalar(this.scatterRadius);
                    
                    // Self Rotation in scatter mode
                    this.mesh.rotateOnAxis(this.rotationAxis, this.rotationSpeed);
                    
                } else if (STATE.mode === CONFIG.modes.FOCUS) {
                    if (this.type === 'PHOTO' && this.mesh.userData.isFocusTarget) {
                        this.targetPos.set(0, 2, 35); // Close to camera
                        this.mesh.rotation.set(0, 0, 0);
                        this.mesh.scale.setScalar(THREE.MathUtils.lerp(this.mesh.scale.x, 4.5, dt * 2));
                        return; // Skip normal lerp for special scale handling
                    } else {
                        // Repel others
                        this.targetPos.copy(this.scatterDir).multiplyScalar(40); // Push far away
                    }
                }

                // Physics/Smoothing
                this.mesh.position.lerp(this.targetPos, dt * 2.5);
                
                if (STATE.mode !== CONFIG.modes.FOCUS || (this.type === 'PHOTO' && !this.mesh.userData.isFocusTarget)) {
                    this.mesh.scale.lerp(new THREE.Vector3(1,1,1), dt * 2);
                }
            }
        }

        // --- COMPUTER VISION MANAGER ---
        class VisionManager {
            constructor(onGesture) {
                this.video = document.getElementById('webcam');
                this.canvas = document.getElementById('cv-canvas');
                this.onGesture = onGesture;
                this.lastVideoTime = -1;
                this.statusText = document.getElementById('status-text');
            }

            async init() {
                try {
                    const vision = await FilesetResolver.forVisionTasks(
                        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                    );
                    
                    this.handLandmarker = await HandLandmarker.createFromOptions(vision, {
                        baseOptions: {
                            modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                            delegate: "GPU"
                        },
                        runningMode: "VIDEO",
                        numHands: 1
                    });

                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    this.video.srcObject = stream;
                    await new Promise(r => this.video.onloadedmetadata = r);
                    this.video.play();
                    this.statusText.innerText = "AI ACTIVE: WAVE TO CONTROL";
                    return true;
                } catch (e) {
                    console.error(e);
                    this.statusText.innerText = "AI ERROR (Check Camera)";
                    return false;
                }
            }

            detect() {
                if (!this.handLandmarker || this.video.currentTime === this.lastVideoTime) return;
                this.lastVideoTime = this.video.currentTime;
                
                const result = this.handLandmarker.detectForVideo(this.video, performance.now());
                
                if (result.landmarks && result.landmarks.length > 0) {
                    STATE.hand.present = true;
                    const lm = result.landmarks[0]; // 21 landmarks
                    
                    // Update Cursor (Landmark 9 is middle finger MCP / palm center approx)
                    // MediaPipe X is inverted for mirror effect usually, but let's keep raw
                    STATE.hand.x = 1 - lm[9].x; // Mirroring logic
                    STATE.hand.y = lm[9].y;

                    // Gestures
                    // 1. Pinch (Thumb tip 4 vs Index tip 8)
                    const pinchDist = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
                    
                    // 2. Fist vs Open (Avg distance of tips to wrist 0)
                    const tips = [8, 12, 16, 20];
                    let avgDist = 0;
                    tips.forEach(t => {
                        avgDist += Math.hypot(lm[t].x - lm[0].x, lm[t].y - lm[0].y);
                    });
                    avgDist /= 4;

                    if (pinchDist < 0.05) {
                        this.onGesture('PINCH');
                    } else if (avgDist < 0.25) { // Thresholds depend on coordinate space, usually 0-1
                        this.onGesture('FIST'); 
                    } else if (avgDist > 0.4) {
                        this.onGesture('OPEN');
                    }
                } else {
                    STATE.hand.present = false;
                }
            }
        }

        // --- MAIN APP ---
        class App {
            constructor() {
                this.container = document.body;
                this.particles = [];
                this.photos = [];
                
                this.setupThree();
                this.createWorld();
                this.setupInputs();
                
                this.vision = new VisionManager(this.handleGesture.bind(this));
                
                // Start loading sequence
                this.init();
            }

            async init() {
                await this.vision.init();
                // Add default photo
                this.addPhoto(AssetFactory.createDefaultPhoto());
                
                // Hide loader
                document.getElementById('loader').style.opacity = 0;
                setTimeout(() => document.getElementById('loader').remove(), 1000);
                
                STATE.isLoaded = true;
                this.animate();
            }

            setupThree() {
                // Renderer
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.renderer.toneMapping = THREE.ReinhardToneMapping;
                this.renderer.toneMappingExposure = 2.2;
                this.container.appendChild(this.renderer.domElement);

                // Scene & Camera
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 200);
                this.camera.position.set(0, 2, 50);

                // Environment
                const pmremGenerator = new THREE.PMREMGenerator(this.renderer);
                this.scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

                // Lighting
                const ambient = new THREE.AmbientLight(0xffffff, 0.6);
                this.scene.add(ambient);

                const centerLight = new THREE.PointLight(0xffaa00, 2, 50);
                this.scene.add(centerLight);

                const spotGold = new THREE.SpotLight(CONFIG.colors.gold, 1200);
                spotGold.position.set(30, 40, 40);
                spotGold.angle = 0.5;
                spotGold.penumbra = 0.5;
                this.scene.add(spotGold);

                const spotBlue = new THREE.SpotLight(0x4444ff, 600);
                spotBlue.position.set(-30, 20, -30);
                this.scene.add(spotBlue);

                // Post Processing
                this.composer = new EffectComposer(this.renderer);
                this.composer.addPass(new RenderPass(this.scene, this.camera));
                
                const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
                bloomPass.threshold = 0.7;
                bloomPass.strength = 0.45;
                bloomPass.radius = 0.4;
                this.composer.addPass(bloomPass);
                
                this.composer.addPass(new OutputPass()); // Handles color space conversion
            }

            createWorld() {
                this.mainGroup = new THREE.Group();
                this.scene.add(this.mainGroup);

                // Shared Geometries & Materials
                const boxGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
                const sphereGeo = new THREE.SphereGeometry(0.3, 16, 16);
                
                // Candy Cane Geometry (Tube)
                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(0, -1, 0),
                    new THREE.Vector3(0, 0.5, 0),
                    new THREE.Vector3(0.2, 0.8, 0),
                    new THREE.Vector3(0.5, 0.6, 0)
                ]);
                const caneGeo = new THREE.TubeGeometry(curve, 20, 0.1, 8, false);
                const caneMat = new THREE.MeshStandardMaterial({ 
                    map: AssetFactory.createCandyCaneTexture(),
                    roughness: 0.3, metalness: 0.1 
                });

                const materials = [
                    new THREE.MeshStandardMaterial({ color: CONFIG.colors.gold, metalness: 0.8, roughness: 0.2 }),
                    new THREE.MeshStandardMaterial({ color: CONFIG.colors.green, roughness: 0.8 }),
                    new THREE.MeshPhysicalMaterial({ color: CONFIG.colors.red, metalness: 0.1, roughness: 0.1, clearcoat: 1.0 })
                ];

                // Create Particles
                for(let i=0; i<CONFIG.count.main; i++) {
                    let mesh;
                    const r = Math.random();
                    if(r < 0.6) {
                        mesh = new THREE.Mesh(boxGeo, materials[Math.floor(Math.random()*2)]);
                    } else if(r < 0.9) {
                        mesh = new THREE.Mesh(sphereGeo, materials[2]);
                    } else {
                        mesh = new THREE.Mesh(caneGeo, caneMat);
                    }
                    
                    mesh.position.set((Math.random()-0.5)*50, (Math.random()-0.5)*50, (Math.random()-0.5)*50);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    
                    this.mainGroup.add(mesh);
                    this.particles.push(new Particle(mesh));
                }

                // Dust Particles
                const dustGeo = new THREE.BufferGeometry();
                const dustPos = [];
                for(let i=0; i<CONFIG.count.dust; i++) {
                    dustPos.push((Math.random()-0.5)*60, (Math.random()-0.5)*60, (Math.random()-0.5)*60);
                }
                dustGeo.setAttribute('position', new THREE.Float32BufferAttribute(dustPos, 3));
                const dustMat = new THREE.PointsMaterial({ 
                    color: CONFIG.colors.gold, size: 0.1, transparent: true, opacity: 0.6 
                });
                const dustSystem = new THREE.Points(dustGeo, dustMat);
                this.scene.add(dustSystem);
                this.dustSystem = dustSystem;
            }

            addPhoto(texture) {
                // Photo Frame
                const frameGeo = new THREE.BoxGeometry(3, 3, 0.1);
                const frameMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.gold, metalness: 0.9, roughness: 0.1 });
                const photoMat = new THREE.MeshBasicMaterial({ map: texture });
                
                const mesh = new THREE.Mesh(frameGeo, [
                    frameMat, frameMat, frameMat, frameMat, photoMat, frameMat
                ]); // Face 4 is front Z+

                mesh.position.set(0,0,0);
                this.mainGroup.add(mesh);
                
                const p = new Particle(mesh, 'PHOTO');
                this.particles.push(p);
                this.photos.push(mesh);
            }

            handleGesture(type) {
                if (!STATE.isLoaded) return;
                
                const st = document.getElementById('status-text');
                
                if (type === 'FIST') {
                    if (STATE.mode !== CONFIG.modes.TREE) {
                        STATE.mode = CONFIG.modes.TREE;
                        st.innerText = "MODE: CHRISTMAS TREE";
                    }
                } else if (type === 'OPEN') {
                    if (STATE.mode !== CONFIG.modes.SCATTER) {
                        STATE.mode = CONFIG.modes.SCATTER;
                        st.innerText = "MODE: SCATTER STARS";
                    }
                } else if (type === 'PINCH') {
                    if (STATE.mode !== CONFIG.modes.FOCUS && this.photos.length > 0) {
                        STATE.mode = CONFIG.modes.FOCUS;
                        // Select random photo
                        this.photos.forEach(p => p.userData.isFocusTarget = false);
                        const target = this.photos[Math.floor(Math.random() * this.photos.length)];
                        target.userData.isFocusTarget = true;
                        st.innerText = "MODE: MEMORY FOCUS";
                    }
                }
            }

            setupInputs() {
                // File Upload
                const input = document.getElementById('file-input');
                input.addEventListener('change', (e) => {
                    if(e.target.files && e.target.files[0]) {
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            new THREE.TextureLoader().load(ev.target.result, (t) => {
                                t.colorSpace = THREE.SRGBColorSpace;
                                this.addPhoto(t);
                            });
                        };
                        reader.readAsDataURL(e.target.files[0]);
                    }
                });

                // H Key to hide
                window.addEventListener('keydown', (e) => {
                    if(e.key.toLowerCase() === 'h') {
                        document.getElementById('ui-container').classList.toggle('ui-hidden');
                    }
                });

                // Resize
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                    this.composer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            animate() {
                requestAnimationFrame(this.animate.bind(this));
                
                const time = performance.now() * 0.001;
                const dt = 0.016; // Approx fixed delta for smoothness

                // Vision
                this.vision.detect();

                // Group Rotation based on Hand or Auto
                if (STATE.hand.present) {
                    // Map Hand X/Y (0-1) to Rotation angles
                    const targetRotY = (STATE.hand.x - 0.5) * 2; // -1 to 1 rad
                    const targetRotX = (STATE.hand.y - 0.5) * 1; 
                    this.mainGroup.rotation.y = THREE.MathUtils.lerp(this.mainGroup.rotation.y, targetRotY, 0.1);
                    this.mainGroup.rotation.x = THREE.MathUtils.lerp(this.mainGroup.rotation.x, targetRotX, 0.1);
                } else {
                    // Auto idle rotation
                    this.mainGroup.rotation.y += 0.001;
                    this.mainGroup.rotation.x = THREE.MathUtils.lerp(this.mainGroup.rotation.x, 0, 0.05);
                }

                // Update Particles
                this.particles.forEach(p => p.update(dt, time));

                // Animate Dust
                if(this.dustSystem) {
                    this.dustSystem.rotation.y = -time * 0.05;
                }

                this.composer.render();
            }
        }

        // Start App
        new App();

    </script>
</body>
</html>
