<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Controlled 3D Christmas Tree</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
            color: #d4af37; /* Metallic Gold */
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: #fff;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #d4af37;
            margin-top: 5px;
        }

        #controls {
            pointer-events: auto;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Custom Button */
        .btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 10px 30px;
            font-family: inherit;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            backdrop-filter: blur(5px);
        }

        .btn:hover {
            background: #d4af37;
            color: #000;
            box-shadow: 0 0 20px #d4af37;
        }

        /* Instructions */
        #instructions {
            position: absolute;
            bottom: 30px;
            left: 30px;
            font-size: 0.8rem;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
        }
        
        .key-gesture {
            color: #ff4d4d;
            font-weight: bold;
        }

        /* Hide the raw video feed */
        #input_video {
            display: none;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            z-index: 20;
            font-size: 1.2rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <video id="input_video"></video>

    <div id="loading">Initializing Neural Network & 3D Engine...<br><span style="font-size:0.8em; color:gray">Please allow camera access</span></div>

    <div id="ui-layer">
        <header>
            <h1>Merry Christmas</h1>
            <div class="subtitle">Interactive Memory Cloud</div>
        </header>

        <div id="instructions">
            <div><span class="key-gesture">FIST</span> : Form Tree</div>
            <div><span class="key-gesture">OPEN HAND</span> : Scatter Stars</div>
            <div><span class="key-gesture">PINCH</span> : Focus Photo</div>
            <div><span class="key-gesture">MOVE</span> : Rotate View</div>
        </div>

        <div id="controls">
            <input type="file" id="file-input" multiple accept="image/*" style="display: none;">
            <button class="btn" onclick="document.getElementById('file-input').click()">ADD MEMORIES</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@mediapipe/hands": "https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js",
                "@mediapipe/camera_utils": "https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- GLOBAL CONFIG ---
        const CONFIG = {
            particleCount: 800,
            treeHeight: 30,
            treeRadius: 10,
            colors: [0x1a472a, 0x800020, 0xd4af37, 0xffffff], // Matte Green, Red, Gold, White
            bloomStrength: 1.8,
            bloomRadius: 0.8,
            bloomThreshold: 0.15
        };

        // --- STATE MACHINE ---
        const STATE = {
            TREE: 'tree',
            SCATTER: 'scatter',
            FOCUS: 'focus',
            current: 'tree',
            targetRotation: 0,
            handPos: { x: 0, y: 0 },
            focusedPhotoIndex: -1
        };

        // --- 3D ENGINE VARIABLES ---
        let scene, camera, renderer, composer;
        let particles = []; 
        let photos = [];
        let instancedMesh; // For optimization of geometric shapes
        let dummy = new THREE.Object3D();
        let starMesh;
        
        // --- HAND TRACKING VARIABLES ---
        let handsResults = null;

        // --- INIT ---
        window.onload = () => {
            initThree();
            initMediaPipe();
            setupInteractions();
            animate();
        };

        // --- 1. THREE.JS SETUP ---
        function initThree() {
            const container = document.getElementById('canvas-container');

            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.02);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 40);
            camera.lookAt(0, 10, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            container.appendChild(renderer.domElement);

            // Post-Processing (Bloom)
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = CONFIG.bloomThreshold;
            bloomPass.strength = CONFIG.bloomStrength;
            bloomPass.radius = CONFIG.bloomRadius;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffeebb, 2, 100);
            pointLight.position.set(0, 20, 10);
            scene.add(pointLight);
            
            // Add a subtle bottom up light
            const bottomLight = new THREE.DirectionalLight(0xd4af37, 1);
            bottomLight.position.set(0, -10, 5);
            scene.add(bottomLight);

            // Create Content
            createParticles();
            createTopStar();
            
            // Default Photos (Generative Placeholders)
            for(let i=0; i<6; i++) {
                addPhoto(generatePlaceholderTexture(i));
            }

            // Handle Resize
            window.addEventListener('resize', onWindowResize, false);
        }

        // --- 2. OBJECT GENERATION ---
        
        function createParticles() {
            // Geometry Mix: Spheres, Cubes
            const geometry = new THREE.IcosahedronGeometry(0.5, 0);
            // Material: MeshStandard for reacting to light + bloom
            const material = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.3,
                metalness: 0.8,
            });

            instancedMesh = new THREE.InstancedMesh(geometry, material, CONFIG.particleCount);
            instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); // Will update every frame
            scene.add(instancedMesh);

            for (let i = 0; i < CONFIG.particleCount; i++) {
                // Determine Type & Color
                const colorHex = CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)];
                const color = new THREE.Color(colorHex);
                
                // Emissive for white particles to make them glow hard
                if (colorHex === 0xffffff) {
                   // logic handled in shader usually, but here we just colorize
                }

                instancedMesh.setColorAt(i, color);

                // Calculate Tree Position (Spiral Cone)
                const y = Math.random() * CONFIG.treeHeight; // 0 to 30
                const radiusAtY = (1 - y / CONFIG.treeHeight) * CONFIG.treeRadius;
                const angle = y * 5 + Math.random() * Math.PI * 2;
                
                const treePos = new THREE.Vector3(
                    Math.cos(angle) * radiusAtY,
                    y,
                    Math.sin(angle) * radiusAtY
                );

                // Calculate Scatter Position (Random Cloud)
                const scatterPos = new THREE.Vector3(
                    (Math.random() - 0.5) * 60,
                    (Math.random() - 0.5) * 40 + 15,
                    (Math.random() - 0.5) * 30
                );

                particles.push({
                    id: i,
                    currentPos: treePos.clone(),
                    treePos: treePos,
                    scatterPos: scatterPos,
                    velocity: new THREE.Vector3(),
                    scale: Math.random() * 0.5 + 0.3
                });
                
                // Set Initial transform
                dummy.position.copy(treePos);
                dummy.scale.setScalar(particles[i].scale);
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);
            }
            instancedMesh.instanceMatrix.needsUpdate = true;
            instancedMesh.instanceColor.needsUpdate = true;
        }

        function createTopStar() {
            const geo = new THREE.OctahedronGeometry(1.5, 0);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffdd88 });
            starMesh = new THREE.Mesh(geo, mat);
            starMesh.position.set(0, CONFIG.treeHeight + 1, 0);
            
            // Add a glow halo
            const glowGeo = new THREE.SphereGeometry(2, 16, 16);
            const glowMat = new THREE.MeshBasicMaterial({ 
                color: 0xffaa00, 
                transparent: true, 
                opacity: 0.3,
                blending: THREE.AdditiveBlending 
            });
            const halo = new THREE.Mesh(glowGeo, glowMat);
            starMesh.add(halo);

            scene.add(starMesh);
        }

        function addPhoto(texture) {
            const ratio = texture.image ? texture.image.width / texture.image.height : 1;
            const geo = new THREE.PlaneGeometry(3 * ratio, 3);
            const mat = new THREE.MeshBasicMaterial({ 
                map: texture, 
                side: THREE.DoubleSide,
                transparent: true
            });
            const mesh = new THREE.Mesh(geo, mat);

            // Add a border frame
            const borderGeo = new THREE.BoxGeometry(3 * ratio + 0.2, 3.2, 0.1);
            const borderMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 1, roughness: 0.2 });
            const border = new THREE.Mesh(borderGeo, borderMat);
            border.position.z = -0.06;
            mesh.add(border);

            // Random position in Tree
            const y = Math.random() * (CONFIG.treeHeight - 5) + 2;
            const r = (1 - y/CONFIG.treeHeight) * (CONFIG.treeRadius + 2); // Slightly outside
            const angle = Math.random() * Math.PI * 2;
            
            const treePos = new THREE.Vector3(Math.cos(angle)*r, y, Math.sin(angle)*r);
            const scatterPos = new THREE.Vector3((Math.random()-0.5)*50, (Math.random()-0.5)*40+15, (Math.random()-0.5)*20);

            mesh.position.copy(treePos);
            mesh.lookAt(0, y, 0); // Look at center

            scene.add(mesh);

            photos.push({
                mesh: mesh,
                treePos: treePos,
                treeRot: mesh.rotation.clone(),
                scatterPos: scatterPos,
                scatterRot: new THREE.Euler(Math.random()*Math.PI, Math.random()*Math.PI, 0),
                isFocused: false
            });
        }

        // --- 3. UTILITIES ---

        function generatePlaceholderTexture(index) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = index % 2 === 0 ? '#1a472a' : '#800020';
            ctx.fillRect(0,0,256,256);
            
            // Text
            ctx.fillStyle = '#d4af37';
            ctx.font = '30px Arial';
            ctx.textAlign = 'center';
            ctx.fillText("MEMORY", 128, 110);
            ctx.fillText("#" + (index + 1), 128, 150);
            
            // Border
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 10;
            ctx.strokeRect(10,10,236,236);

            const tex = new THREE.CanvasTexture(canvas);
            return tex;
        }

        function setupInteractions() {
            const input = document.getElementById('file-input');
            input.addEventListener('change', (e) => {
                const files = e.target.files;
                if(files) {
                    for(let i=0; i<files.length; i++) {
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            const img = new Image();
                            img.src = ev.target.result;
                            img.onload = () => {
                                const tex = new THREE.Texture(img);
                                tex.needsUpdate = true;
                                addPhoto(tex);
                            }
                        };
                        reader.readAsDataURL(files[i]);
                    }
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 4. MEDIAPIPE LOGIC ---
        
        async function initMediaPipe() {
            const { Hands } = window; 
            const hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});
            
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onHandsResults);

            const video = document.getElementById('input_video');
            const cameraUtils = window.Camera; // Loaded from CDN script
            
            const cameraObj = new cameraUtils.Camera(video, {
                onFrame: async () => {
                    await hands.send({image: video});
                },
                width: 640,
                height: 480
            });
            cameraObj.start()
                .then(() => document.getElementById('loading').style.display = 'none')
                .catch(err => {
                    console.error(err);
                    document.getElementById('loading').innerText = "Camera Access Denied or Error.";
                });
        }

        function onHandsResults(results) {
            handsResults = results;
            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) return;

            const landmarks = results.multiHandLandmarks[0];
            analyzeGesture(landmarks);
        }

        function analyzeGesture(landmarks) {
            // Helpers
            const dist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);
            
            // 1. Detect Open Hand vs Fist (Average distance of fingertips to wrist)
            const wrist = landmarks[0];
            const tips = [4, 8, 12, 16, 20]; // Thumb, Index, Middle, Ring, Pinky tips
            let avgDist = 0;
            tips.forEach(i => avgDist += dist(landmarks[i], wrist));
            avgDist /= tips.length;

            // 2. Detect Pinch (Index tip to Thumb tip)
            const pinchDist = dist(landmarks[8], landmarks[4]);
            
            // Logic State Machine
            const handX = landmarks[9].x; // Middle finger base x (0-1)
            const handY = landmarks[9].y;
            
            STATE.handPos = { x: (handX - 0.5) * 2, y: (handY - 0.5) * 2 }; // Normalized -1 to 1

            // Thresholds
            const OPEN_THRESHOLD = 0.35;
            const FIST_THRESHOLD = 0.15; // Adjusted conservative value
            const PINCH_THRESHOLD = 0.05;

            // State Transitions
            if (pinchDist < PINCH_THRESHOLD && STATE.current === STATE.SCATTER) {
                // Determine which photo to focus on (closest to center?)
                // For simplicity, we just trigger focus on a photo based on hand X mapping to photo list
                if(photos.length > 0 && STATE.current !== STATE.FOCUS) {
                    STATE.current = STATE.FOCUS;
                    // Pick a random photo or based on mapping for demo
                    STATE.focusedPhotoIndex = Math.floor(Math.abs(STATE.handPos.x) * photos.length) % photos.length;
                }
            } else if (pinchDist > 0.1 && STATE.current === STATE.FOCUS) {
                // Release pinch -> return to scatter
                STATE.current = STATE.SCATTER;
            } else {
                if (avgDist < FIST_THRESHOLD) {
                    STATE.current = STATE.TREE;
                } else if (avgDist > OPEN_THRESHOLD) {
                    if (STATE.current === STATE.TREE) STATE.current = STATE.SCATTER;
                }
            }
        }

        // --- 5. ANIMATION LOOP ---

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;
            const dt = 0.05; // Interpolation factor

            // 1. Camera / Scene Rotation Logic
            if (STATE.current === STATE.SCATTER || STATE.current === STATE.FOCUS) {
                // Hand horizontal movement rotates the tree/camera group
                // Use targetRotation for smooth damping
                STATE.targetRotation = STATE.handPos.x * Math.PI; // -PI to PI
            } else {
                STATE.targetRotation = time * 0.1; // Slow auto rotation in tree mode
            }
            
            // Smoothly interpolate rotation
            const currentRot = scene.rotation.y;
            scene.rotation.y += (STATE.targetRotation - currentRot) * 0.05;

            // 2. Update Particles (InstancedMesh)
            for (let i = 0; i < CONFIG.particleCount; i++) {
                const p = particles[i];
                let target;

                if (STATE.current === STATE.TREE) {
                    target = p.treePos;
                } else {
                    target = p.scatterPos;
                }

                // Add slight noise/float
                const floatX = Math.sin(time + p.id) * 0.2;
                const floatY = Math.cos(time + p.id * 0.5) * 0.2;

                // Lerp Position
                p.currentPos.lerp(target, dt);
                
                dummy.position.set(
                    p.currentPos.x + floatX, 
                    p.currentPos.y + floatY, 
                    p.currentPos.z
                );
                
                // Rotation
                dummy.rotation.set(time * 0.5, time * 0.3, 0);
                dummy.scale.setScalar(p.scale);
                
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);
            }
            instancedMesh.instanceMatrix.needsUpdate = true;

            // 3. Update Photos
            photos.forEach((photo, index) => {
                let targetPos, targetRot;
                let targetScale = 1;

                if (STATE.current === STATE.FOCUS && index === STATE.focusedPhotoIndex) {
                    // Bring to front center relative to camera
                    // Since camera is at z=40, we put it at z=25? 
                    // But scene rotates, so we must calculate world position carefully
                    // Simplification: In Scene Space, we put it at 0, 15, 20 (closer to camera)
                    // And we counteract scene rotation so it faces camera
                    
                    targetPos = new THREE.Vector3(0, 15, 25);
                    // Counter-rotate object so it faces screen constantly
                    targetRot = new THREE.Euler(0, -scene.rotation.y, 0); 
                    targetScale = 3.0; // Enlarge

                } else if (STATE.current === STATE.TREE) {
                    targetPos = photo.treePos;
                    // Look at center (0,y,0)
                    const lookDummy = new THREE.Object3D();
                    lookDummy.position.copy(photo.treePos);
                    lookDummy.lookAt(0, photo.treePos.y, 0);
                    targetRot = lookDummy.rotation;
                } else {
                    // Scatter
                    targetPos = photo.scatterPos;
                    targetRot = photo.scatterRot;
                }

                // Lerp
                photo.mesh.position.lerp(targetPos, dt);
                
                // Slerp Rotation (Quaternion)
                const qCurrent = photo.mesh.quaternion;
                const qTarget = new THREE.Quaternion().setFromEuler(targetRot);
                photo.mesh.quaternion.slerp(qTarget, dt);

                // Lerp Scale
                const s = photo.mesh.scale.x; // uniform scale
                const newS = THREE.MathUtils.lerp(s, targetScale, dt);
                photo.mesh.scale.setScalar(newS);
                
                // If focus mode, push non-focused photos back or fade them?
                // For now just let them scatter.
            });

            // 4. Star Animation
            if(starMesh) {
                starMesh.rotation.y = time;
                starMesh.children[0].scale.setScalar(1 + Math.sin(time * 3) * 0.1); // Pulse halo
                
                let starTargetY = CONFIG.treeHeight + 1;
                if(STATE.current !== STATE.TREE) starTargetY += 10; // Float up when scattered
                
                starMesh.position.y += (starTargetY - starMesh.position.y) * 0.05;
            }

            composer.render();
        }

    </script>
</body>
</html>
